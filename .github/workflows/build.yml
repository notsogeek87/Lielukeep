name: Build

on:
  # Toutes les branches : on valide une branche de travail AVANT de la fusionner.
  # Les releases, elles, restent réservées à `main` (même convention que lieluinit).
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

# Un nouveau push sur une branche de travail annule le run précédent ; sur main chaque run publie sa release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.ref_name == 'main' }}
      # Devient versionCode et dernier segment du versionName (voir app/build.gradle.kts).
      BUILD_NUMBER: ${{ github.run_number }}
      # Clé de publication optionnelle. Sans ces secrets, l'APK est signé avec le keystore versionné
      # (app/debug.keystore) : installable et mettable à jour par-dessus.
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build identifiers
        id: ids
        run: |
          base="$(grep -m1 '^appVersionBase=' gradle.properties | cut -d= -f2)"
          name="$(grep -m1 '^appName=' gradle.properties | cut -d= -f2-)"
          if [ -z "$base" ] || [ -z "$name" ]; then
            echo "::error::appVersionBase / appName introuvables dans gradle.properties"
            exit 1
          fi
          # Même valeur que le versionName compilé : tag v1.4.<run>.
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "app_name=$name" >> "$GITHUB_OUTPUT"
          echo "app_slug=$(echo "$name" | tr -cs 'A-Za-z0-9._' '-' | sed 's/^-//; s/-$//')" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "ref_slug=$(echo "${{ github.ref_name }}" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Pas de KEYSTORE_BASE64 : signature avec le keystore versionné."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Sur toutes les branches : une branche dont l'APK release ne se construit pas ne doit pas être fusionnée.
      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p artifact
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi="$(basename "$apk" | sed 's/^app-\(.*\)-release\.apk$/\1/')"
            cp "$apk" "artifact/${{ steps.ids.outputs.app_slug }}-${{ steps.ids.outputs.version }}-$abi.apk"
          done
          if [ -z "$(ls artifact)" ]; then
            echo "::error::Aucun APK release trouvé"
            exit 1
          fi
          ls -l artifact

      - name: Publish release for this build
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ids.outputs.version }}
          name: "${{ steps.ids.outputs.app_name }} ${{ steps.ids.outputs.version }} (build ${{ github.run_number }})"
          prerelease: false
          files: artifact/*.apk
          body: |
            ## Installer ${{ steps.ids.outputs.app_name }}

            | APK | Appareil |
            |---|---|
            | `*-arm64-v8a.apk` | La plupart des téléphones récents |
            | `*-armeabi-v7a.apk` | Anciens appareils 32 bits |
            | `*-x86_64.apk` | Émulateurs |
            | `*-universal.apk` | Tous (en cas de doute) |

            Ouvrez le fichier téléchargé ; si Android bloque l'installation, autorisez la source dans « Paramètres ».
            Les données sont conservées lors d'une mise à jour.

            ---
            Build automatique depuis le commit `${{ steps.ids.outputs.sha }}` (branche `${{ github.ref_name }}`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.ids.outputs.ref_slug }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore
